services:
  # Backend Web Service
  - type: web
    name: stocksense-api
    env: node
    plan: free
    buildCommand: cd backend && npm install && npm run build && npm run seed
    startCommand: cd backend && npm run start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d

  # Frontend Static Site
  - type: web
    name: stocksense-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: stocksense-api
          property: host
